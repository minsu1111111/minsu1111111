name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#EE1515&color_dots=#ebedf0,#FFF1A8,#FFDE59,#FFCB05,#C79E00
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#EE1515&color_dots=#161b22,#5C4A00,#8F7300,#C79E00,#FFCB05

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
